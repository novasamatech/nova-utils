<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="WOF — Wheel of Fortune">
  <!-- Icon für Novas DApp-Katalog (S234): das Einhorn-Hütchen — Kopf + Regenbogenhorn aus
       app/web/src/unicorn.js (dieselbe Geometrie, 8× skaliert), auf weißer Scheibe wie das Print-Logo.
       Sebi-Entscheid 03.09.: „das Hütchen vom Einhorn als Logo". -->
  <defs>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="16%" stop-color="#ff8800"/>
      <stop offset="33%" stop-color="#ffff00"/>
      <stop offset="50%" stop-color="#00ff00"/>
      <stop offset="66%" stop-color="#0088ff"/>
      <stop offset="83%" stop-color="#8800ff"/>
      <stop offset="100%" stop-color="#ff0000"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="128" fill="#ffffff"/>
  <g transform="translate(-200,147) scale(8)">
    <!-- Kopf -->
    <circle cx="41" cy="5" r="3.2" fill="#000"/>
    <!-- Horn (das Hütchen) -->
    <polygon points="41,-13 38.2,3.2 43.8,3.2" fill="url(#horn)"/>
    <!-- Augen -->
    <circle cx="42.5" cy="4.8" r="0.7" fill="#fff"/>
    <circle cx="40" cy="4.8" r="0.7" fill="#fff"/>
  </g>
</svg>
