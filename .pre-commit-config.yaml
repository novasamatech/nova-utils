repos:
-   repo: https://github.com/novasamatech/pre-commit-hooks
    rev: 60a603fc64cc2c80423aa10504b63cbe630db744
    hooks:
    -   id: check-chains-json
    -   id: check-dapps-json
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-json

-   repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
    -   id: flake8

-   repo: local
    hooks:
    -   id: check-default-assets
        name: default assets resolve against their chains file
        entry: python3 scripts/check_default_assets.py
        language: system
        files: ^chains/.*/default_assets(_dev)?\.json$
    -   id: check-node-url-keys
        name: node URLs carry no provider keys
        entry: python3 scripts/check_node_url_keys.py
        language: system
        files: ^chains/.*\.json$
        # pre-commit hides the output of a passing hook; the known keyed URLs are printed as warnings
        verbose: true
        # one process, so that each known keyed URL is printed once
        require_serial: true
    -   id: test-node-url-keys-check
        name: tests of the node URL key check
        # --confcutdir keeps tests/conftest.py, which needs the full project environment, out of the run
        entry: python -m pytest tests/checks --confcutdir tests/checks -q -p no:cacheprovider
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false
        files: ^(scripts/check_node_url_keys\.py|scripts/.*node_url.*\.txt|tests/checks/.*|chains/.*\.json)$
